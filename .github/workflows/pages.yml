name: Pages

# Publishes the site to https://looting-glass.github.io/. Screenshots and the icon are fetched
# from the desktop and android repos at deploy time; the changelog and the download links come
# from their releases, and the docs pages from the desktop repo's docs/. The daily run picks up
# new screenshots, docs and releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover scripts
      - run: scripts/fetch-images.sh
      - run: scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages sometimes doesn't see the artifact just uploaded yet ("No artifacts named
      # github-pages were found"), even once the artifact list shows it. A second try a little
      # later finds it.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
