name: Pages

# Publishes the site to https://looting-glass.github.io/. Screenshots and the icon are fetched
# from the desktop and android repos at deploy time; the changelog and the download links come
# from their releases. The daily run picks up new screenshots and releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/fetch-images.sh
      - run: scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # The artifact list can lag the upload by a few seconds, and deploy-pages gives up when it
      # doesn't see the artifact yet; wait (up to a minute) until it's listed.
      - name: Wait for the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count)
            [ "$n" -ge 1 ] && exit 0
            sleep 2
          done
          echo "::warning::github-pages artifact still not listed; deploying anyway"
      - id: deploy
        uses: actions/deploy-pages@v5
